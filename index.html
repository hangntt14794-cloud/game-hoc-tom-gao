<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIDS LEARNING AI GAME STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2FF; --panel:#FFFFFF; --ink:#22264A; --ink2:#5A5F85; --line:#D9DEF5;
  --math:#3F6CF2; --math-s:#DCE5FF; --viet:#F2693F; --viet-s:#FFE2D8;
  --eng:#10A981; --eng-s:#CFF3E7; --logic:#8B5CF6; --logic-s:#E8DEFF;
  --star:#FFC21A; --ok:#14A44D; --ok-s:#D9F7E3; --bad:#E5484D; --bad-s:#FFE1E2;
  --r:20px; --shadow:0 2px 0 rgba(34,38,74,.08), 0 10px 24px -12px rgba(34,38,74,.25);
  --head:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
:focus-visible{outline:3px solid #FFB800;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:20}
#top .brand{font-family:var(--head);font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
#top .brand i{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--star);box-shadow:0 3px 0 #D79A00}
#top .sp{flex:1}
#savestat{font-size:.82rem;color:var(--ink2);white-space:nowrap}
#savestat.err{color:var(--bad);font-weight:700}
#nav{background:var(--panel);border-right:2px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
#nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:14px;cursor:pointer;text-align:left;font-weight:700;color:var(--ink2)}
#nav button:hover{background:var(--bg)}
#nav button.on{background:var(--ink);color:#fff}
#nav .ico{font-size:1.25rem;width:26px;text-align:center}
#nav .sep{height:1px;background:var(--line);margin:8px 6px}
#main{padding:22px 26px 60px;min-width:0}
.view-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head p{color:var(--ink2)}
.view-head .grow{flex:1;min-width:220px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:9px 18px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.go{background:var(--ok)} .btn.warn{background:var(--bad)} .btn.sm{padding:5px 12px;font-size:.88rem;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.sec.sm{box-shadow:0 2px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font-weight:600}
.field textarea{min-height:90px;resize:vertical}
.field small{font-weight:600;color:var(--ink2)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>.field{flex:1;min-width:140px}
.card{background:var(--panel);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--bg);color:var(--ink2)}
.chip.math{background:var(--math-s);color:var(--math)} .chip.viet{background:var(--viet-s);color:#B7421E}
.chip.eng{background:var(--eng-s);color:#0A7A5C} .chip.logic{background:var(--logic-s);color:#6B3DD6}
.chip.ok{background:var(--ok-s);color:#0C7A36} .chip.bad{background:var(--bad-s);color:#B3262B} .chip.warn{background:#FFF0C2;color:#8A5B00}
.muted{color:var(--ink2)} .tc{text-align:center}
.empty{padding:40px 20px;text-align:center;color:var(--ink2);background:#fff;border-radius:var(--r);border:2px dashed var(--line)}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--ink)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--ink)} .rng b{min-width:52px;text-align:right}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
.hello{background:var(--ink);color:#fff;border-radius:28px;padding:26px 28px;position:relative;overflow:hidden}
.hello h1{font-size:2.3rem;margin-bottom:6px}
.hello p{color:#C9CEF5;max-width:46ch}
.hello .big{position:absolute;right:-8px;bottom:-26px;font-size:7.5rem;opacity:.95;transform:rotate(-8deg)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--head);font-size:1.9rem;line-height:1.1}
.stat span{color:var(--ink2);font-size:.85rem;font-weight:700}
.subj-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:22px 0}
.tile{border:0;border-radius:22px;padding:18px;text-align:left;cursor:pointer;font-weight:800;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.14);transition:transform .1s}
.tile:hover{transform:translateY(-2px)} .tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.tile .em{font-size:2.4rem} .tile h3{font-size:1.3rem} .tile small{font-weight:600;opacity:.8}
.tile.math{background:var(--math-s);color:#1E3FAE} .tile.viet{background:var(--viet-s);color:#9A3112}
.tile.eng{background:var(--eng-s);color:#07654B} .tile.logic{background:var(--logic-s);color:#52289E}

/* ---------- game library ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.filters .field{min-width:130px}
.gcard{background:#fff;border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;border-top:8px solid var(--c,var(--ink))}
.gcard .gh{display:flex;gap:12px;align-items:center}
.gcard .gi{font-size:2.1rem;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:var(--cs,var(--bg));flex:none}
.gcard h3{font-size:1.15rem}
.gcard .how{color:var(--ink2);font-size:.92rem;flex:1}
.gcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.gcard .ga{display:flex;gap:8px;align-items:center}
.gcard .ga .btn{flex:1}
.fav{border:0;background:transparent;font-size:1.5rem;cursor:pointer;line-height:1;color:#C9CCE6}
.fav.on{color:var(--star)}
.gcard.math{--c:var(--math);--cs:var(--math-s)} .gcard.viet{--c:var(--viet);--cs:var(--viet-s)}
.gcard.eng{--c:var(--eng);--cs:var(--eng-s)} .gcard.logic{--c:var(--logic);--cs:var(--logic-s)}

/* ---------- tables / bank ---------- */
.tbl-wrap{overflow:auto;background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#F6F8FF;font-weight:800;position:sticky;top:0;white-space:nowrap}
tr:hover td{background:#FAFBFF}
td.q{max-width:380px}
td.q b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:12px}
.bulk .btn.sec{background:transparent;color:#fff;border-color:#5C6199;box-shadow:none}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-weight:700;font-size:.92rem}
.bar .track{height:16px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--c,var(--ink))}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:.7rem;color:var(--ink2);font-weight:700}
.days i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--math);min-height:3px}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:#FFF3C4;font-weight:800}
.badge.off{background:var(--bg);color:#9AA0C6;filter:grayscale(1)}

/* ---------- modal ---------- */
dialog{border:0;border-radius:26px;padding:0;max-width:min(680px,94vw);width:100%;box-shadow:0 30px 80px -20px rgba(20,22,60,.55);color:var(--ink)}
dialog::backdrop{background:rgba(24,27,70,.55)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:150px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.seg label:has(input:checked){border-color:var(--ink);background:#F2F4FF}
.seg small{display:block;font-weight:600;color:var(--ink2)}
.msg{padding:10px 12px;border-radius:12px;font-weight:700;font-size:.92rem}
.msg.err{background:var(--bad-s);color:#8F1D21} .msg.info{background:#E7EEFF;color:#233C9A} .msg.warn{background:#FFF0C2;color:#7A4D00}
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:10000;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);animation:tin .2s}
.toast.err{background:var(--bad)} .toast.ok{background:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* ---------- STAGE (game) ---------- */
.stage{position:relative;background:#fff;border-radius:28px;box-shadow:var(--shadow);min-height:calc(100vh - 140px);display:flex;flex-direction:column;overflow:hidden;border-top:10px solid var(--c)}
.stage.math{--c:var(--math);--cs:var(--math-s)} .stage.viet{--c:var(--viet);--cs:var(--viet-s)}
.stage.eng{--c:var(--eng);--cs:var(--eng-s)} .stage.logic{--c:var(--logic);--cs:var(--logic-s)}
.hud{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--cs);flex-wrap:wrap}
.hud .t{font-family:var(--head);font-weight:800;font-size:1.1rem;flex:1;min-width:140px}
.hud .pill{background:#fff;border-radius:99px;padding:3px 14px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.hud .prog{flex-basis:100%;height:10px;background:#fff;border-radius:99px;overflow:hidden}
.hud .prog i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.qbar{display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 22px 6px;text-align:center}
.qtext{font-family:var(--head);font-weight:800;font-size:clamp(1.5rem,3.4vw,2.6rem);line-height:1.2}
.qtext small{display:block;font-family:var(--body);font-size:1rem;font-weight:700;color:var(--ink2);margin-top:4px}
.qtext .hint{font-size:3.2rem;display:block}
.say{width:52px;height:52px;border-radius:50%;border:0;background:var(--cs);font-size:1.5rem;cursor:pointer;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.play{position:relative;flex:1;padding:14px 22px 22px;display:flex;flex-direction:column;justify-content:center;min-height:300px}
.play.locked .target{pointer-events:none}
.fb{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:6;padding:10px 24px;border-radius:99px;font-family:var(--head);font-weight:800;font-size:1.35rem;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:pop .25s;max-width:92%;text-align:center}
.fb.ok{background:var(--ok);color:#fff} .fb.no{background:#FFB020;color:#3A2600}
.fb small{display:block;font-family:var(--body);font-weight:700;font-size:.9rem}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.stage-foot{display:flex;gap:10px;justify-content:space-between;padding:10px 18px;background:#F7F8FF;align-items:center;flex-wrap:wrap}
.cam-pip{position:absolute;right:14px;bottom:62px;width:190px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#10122B;border:4px solid #fff;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);z-index:5}
.cam-pip video,.cam-pip canvas,.cam-big video,.cam-big canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.cam-pip .mirror,.cam-big .mirror{transform:scaleX(-1)}
.cam-pip .st{position:absolute;left:0;right:0;bottom:0;background:rgba(16,18,43,.78);color:#fff;font-size:.72rem;font-weight:700;padding:3px 8px;text-align:center}
.cam-pip.hidevid video{opacity:0}
.cam-big{position:relative;width:100%;aspect-ratio:4/3;background:#10122B;border-radius:18px;overflow:hidden}
#vcursor{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid #fff;background:rgba(255,194,26,.75);box-shadow:0 0 0 3px var(--ink),0 6px 14px rgba(0,0,0,.35);pointer-events:none;z-index:9999;display:none;transition:transform .08s}
#vcursor.pinch{transform:scale(.6);background:rgba(20,164,77,.85)}
#trail{position:fixed;inset:0;pointer-events:none;z-index:9998;display:none}

/* options */
.opts{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));max-width:900px;margin:0 auto;width:100%}
.opts.n2{max-width:620px} .opts.n3{max-width:780px}
.target{position:relative;border:0;cursor:pointer;font-family:var(--head);font-weight:800;color:var(--ink);background:#fff;border-radius:22px;border:3px solid var(--line);border-bottom-width:8px;padding:16px 14px;min-height:88px;font-size:clamp(1.3rem,2.4vw,2rem);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;transition:transform .1s,background .15s,border-color .15s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.target.opt{background:var(--cs);border-color:var(--c)}
.target:hover,.target.hov,.target.dwelling{transform:translateY(-3px) scale(1.03)}
.target:active{transform:translateY(3px);border-bottom-width:4px}
.target.dwelling{border-color:var(--ink)}
.target .kb{position:absolute;left:8px;top:6px;font-family:var(--body);font-size:.72rem;font-weight:800;color:var(--ink2);opacity:.7}
.target .lbl{pointer-events:none}
.target.big .lbl{font-size:clamp(2.2rem,4.5vw,3.6rem)}
.target.ok{background:var(--ok);border-color:#0C7A36;color:#fff;animation:jump .5s}
.target.bad{background:var(--bad-s);border-color:var(--bad);color:#8F1D21;animation:shake .4s}
.target.reveal{background:var(--ok-s);border-color:var(--ok);animation:jump .6s}
.target[disabled]{pointer-events:none}
.target.bad[disabled]{opacity:.55}
.ringsvg{position:absolute;right:6px;top:6px;width:30px;height:30px;transform:rotate(-90deg);opacity:0;pointer-events:none}
.ringsvg circle{fill:none;stroke-width:5}
.ringsvg .bg{stroke:rgba(34,38,74,.15)} .ringsvg .fg{stroke:var(--ok);stroke-linecap:round;stroke-dasharray:100.5;stroke-dashoffset:calc(100.5 * (1 - var(--p,0)))}
.target.dwelling .ringsvg{opacity:1}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes jump{40%{transform:translateY(-14px) scale(1.06)}}
@keyframes bob{50%{transform:translateY(-5px)}}
.float .target .lbl{display:inline-block;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--k,0)*-.55s)}

/* sky / balls */
.sky{position:relative;flex:1;min-height:340px;border-radius:22px;background:linear-gradient(#DCE9FF,#F2F7FF);overflow:hidden}
.bw{position:absolute;top:0;width:88px;margin-left:-44px;will-change:transform}
.ball{position:relative;width:88px;height:88px;min-height:0;padding:0;border-radius:50%;border-width:4px;border-bottom-width:8px;font-size:1.9rem;background:radial-gradient(circle at 30% 28%,#fff 0 12%,var(--cs) 13%);border-color:var(--c);will-change:transform}
.ball:hover,.ball.dwelling{transform:none;outline:5px solid var(--ink)}
/* count */
.things{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:clamp(2.4rem,6vw,4rem);margin:4px auto 14px;max-width:760px;min-height:80px}
.things span{display:inline-block;animation:bob 2.8s ease-in-out infinite;animation-delay:calc(var(--k)*-.3s)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:640px;margin:0 auto;width:100%}
.nums .target{min-height:64px;font-size:1.8rem;padding:8px}
.finger{display:flex;justify-content:center;gap:10px;align-items:center;margin:4px 0 12px;font-weight:800;color:var(--ink2)}
.finger b{font-family:var(--head);font-size:2.2rem;color:var(--ink);min-width:2ch;text-align:center}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px 70px;max-width:620px;margin:0 auto;width:100%}
.pairs .col{display:flex;flex-direction:column;gap:12px}
.pairs .target{min-height:68px;font-size:1.5rem}
.target.sel{background:#FFF3C4;border-color:#E0A800;transform:scale(1.04)}
.target.matched{background:var(--ok-s);border-color:var(--ok);pointer-events:none}
.target.matched.c0{background:#DCE5FF;border-color:#3F6CF2} .target.matched.c1{background:#FFE2D8;border-color:#F2693F}
.target.matched.c2{background:#CFF3E7;border-color:#10A981} .target.matched.c3{background:#E8DEFF;border-color:#8B5CF6}
.target.matched.c4{background:#FFF0C2;border-color:#E0A800} .target.matched.c5{background:#FFDDF0;border-color:#E0449A}
.target.shake{animation:shake .4s}
/* order */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 20px}
.slot{min-width:70px;height:78px;padding:0 12px;border-radius:18px;border:3px dashed var(--c);background:var(--cs);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.7rem}
.slot.filled{border-style:solid;background:#fff}
.slots.ev .slot{min-width:150px;height:auto;min-height:62px;font-size:1.05rem;padding:8px 12px}
.slots.shake{animation:shake .4s}
.pool{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pool .target{min-width:72px;min-height:78px;font-size:1.9rem;padding:8px 16px;background:var(--cs);border-color:var(--c)}
.pool.ev .target{font-size:1.1rem;min-width:150px}
.pool .target.used{visibility:hidden}
.ctls{display:flex;gap:10px;justify-content:center;margin-top:18px}
/* maze */
.mazewrap{display:grid;place-items:center;flex:1}
canvas.maze{background:#FBFCFF;border-radius:18px;border:4px solid var(--c);touch-action:none;max-width:100%}
/* result */
.result{padding:34px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .stars{font-size:3.4rem;letter-spacing:6px}
.result .stars .off{filter:grayscale(1) opacity(.3)}

<div id="app"><header id="top"></header><nav id="nav" aria-label="Menu chính"></nav><main id="main"><p style="padding:30px">Đang tải…</p></main></div>

<script>
'use strict';
/* =====================================================================
   KIDS LEARNING AI GAME STUDIO - Giai đoạn 1
   Module: Util · Settings · DB · Seed · State
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const nfc = s => String(s ?? '').normalize('NFC');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const fmtTime = s => { s = Math.round(s); const m = Math.floor(s / 60); return m ? `${m} phút ${s % 60} giây` : `${s} giây`; };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const isBig = t => Array.from(String(t)).length <= 3;

const SUBJECTS = {
  math: { name: 'Toán', icon: '🔢', hint: 'Cộng, trừ, nhân, chia, đếm' },
  viet: { name: 'Tiếng Việt', icon: '📖', hint: 'Chữ cái, ghép từ, câu' },
  eng: { name: 'Tiếng Anh', icon: '🔤', hint: 'Từ vựng, nghe, ghép hình' },
  logic: { name: 'Tư duy logic', icon: '🧩', hint: 'Quy luật, suy luận, mê cung' }
};
const GRADES = { 0: 'Mẫu giáo', 1: 'Lớp 1', 2: 'Lớp 2', 3: 'Lớp 3', 4: 'Lớp 4', 5: 'Lớp 5' };
const GRADE_GROUPS = { all: ['Tất cả', 0, 5], mg: ['Mẫu giáo', 0, 0], l12: ['Lớp 1–2', 1, 2], l35: ['Lớp 3–5', 3, 5] };
const TYPES = { mcq: 'Trắc nghiệm', count: 'Đếm', word: 'Ghép chữ', order: 'Sắp xếp', pairs: 'Nối cặp', sort: 'Phân loại' };

/* ---------------- Settings (localStorage) ---------------- */
const DEFAULTS = { dwell: 1.2, sens: 6, margin: 10, mirror: true, showVideo: true, showLandmarks: true, showTrail: false,
  sound: true, speech: true, autoRead: false, ballSpeed: 55, maxTries: 2, cameraId: '' };
const Settings = {
  v: { ...DEFAULTS },
  load() { try { Object.assign(this.v, JSON.parse(localStorage.getItem('kls_settings') || '{}')); } catch (e) { /* bỏ qua */ } },
  save() { try { localStorage.setItem('kls_settings', JSON.stringify(this.v)); } catch (e) { toast('Không lưu được cài đặt', 'err'); } },
  set(k, val) { this.v[k] = val; this.save(); }
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem('kls_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kls_' + k, JSON.stringify(v)); } catch (e) { /* bỏ qua */ } }
};

/* ---------------- Toast & modal helpers ---------------- */
function toast(msg, type = '') {
  const box = $('#toasts'); const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg; box.append(t);
  setTimeout(() => t.remove(), 3600);
}
const Modal = {
  el: null,
  open(html, onClose) {
    this.el = $('#modal'); this.el.innerHTML = `<div class="dlg">${html}</div>`; this._onClose = onClose || null;
    if (!this.el.open) this.el.showModal();
    this.el.onclose = () => { const f = this._onClose; this._onClose = null; this.el.innerHTML = ''; if (f) f(); };
    return this.el;
  },
  close() { if (this.el && this.el.open) this.el.close(); }
};
function ask(message, okLabel = 'Đồng ý', danger = false) {
  return new Promise(res => {
    const d = $('#ask'); let done = false;
    d.innerHTML = `<div class="dlg"><p style="font-weight:700;font-size:1.05rem">${message}</p><div class="acts"><button class="btn sec" data-r="0">Hủy</button><button class="btn ${danger ? 'warn' : ''}" data-r="1">${esc(okLabel)}</button></div></div>`;
    d.onclick = e => { const b = e.target.closest('[data-r]'); if (b) { done = true; d.close(); res(b.dataset.r === '1'); } };
    d.onclose = () => { if (!done) res(false); };
    d.showModal();
  });
}

/* ---------------- IndexedDB ---------------- */
class DB {
  constructor() { this.db = null; this.ok = false; }
  open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('Trình duyệt không hỗ trợ IndexedDB'));
      const r = indexedDB.open('kids_learning_ai_studio', 2);
      r.onupgradeneeded = () => { const d = r.result; ['questions', 'students', 'results', 'sessions', 'docs', 'lessons'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); }); if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' }); };
      r.onsuccess = () => { this.db = r.result; this.ok = true; resolve(); };
      r.onerror = () => reject(r.error || new Error('Không mở được IndexedDB'));
      r.onblocked = () => reject(new Error('IndexedDB bị chặn'));
    });
  }
  _tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(store, mode); let out;
      tx.oncomplete = () => resolve(out); tx.onerror = () => reject(tx.error); tx.onabort = () => reject(tx.error || new Error('Giao dịch bị hủy'));
      out = fn(tx.objectStore(store), tx);
    });
  }
  getAll(store) { return new Promise((res, rej) => { const tx = this.db.transaction(store, 'readonly'); const rq = tx.objectStore(store).getAll(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
  put(store, obj) { return this._tx(store, 'readwrite', s => { s.put(obj); }); }
  putMany(store, arr) { return this._tx(store, 'readwrite', s => { arr.forEach(o => s.put(o)); }); }
  del(store, id) { return this._tx(store, 'readwrite', s => { s.delete(id); }); }
  delMany(store, ids) { return this._tx(store, 'readwrite', s => { ids.forEach(i => s.delete(i)); }); }
  clear(store) { return this._tx(store, 'readwrite', s => { s.clear(); }); }
}
const db = new DB();

/* ---------------- Save status ---------------- */
const Save = {
  pending: 0,
  set(cls, text) { const el = $('#savestat'); if (el) { el.className = cls; el.textContent = text; } },
  async run(p) {
    this.pending++; this.set('', 'Đang lưu…');
    try {
      if (db.ok) await p(); this.pending--;
      if (!this.pending) this.set(db.ok ? '' : 'err', db.ok ? 'Đã lưu ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : 'Chỉ lưu tạm (trình duyệt không cho lưu)');
      return true;
    } catch (e) { this.pending--; this.set('err', 'Lỗi lưu dữ liệu'); toast('Không lưu được: ' + (e && e.message || e) + '. Hãy xuất bản sao lưu.', 'err'); return false; }
  }
};

/* ---------------- State ---------------- */
const State = {
  questions: [], students: [], results: [], sessions: [], docs: [], lessons: [],
  mode: LS.get('mode', 'teacher'), student: LS.get('student', null), view: 'dashboard', viewArg: null,
  q(id) { return this.questions.find(q => q.id === id); },
  activeStudent() { return this.students.find(s => s.id === this.student) || null; },
  saveQ(q) { return Save.run(() => db.put('questions', q)); },
  saveQs(arr) { return Save.run(() => db.putMany('questions', arr)); },
  saveStudent(s) { return Save.run(() => db.put('students', s)); }
};

/* =====================================================================
   DỮ LIỆU MẪU – câu hỏi thật, đã kiểm tra đáp án khi nạp
   ===================================================================== */
function buildSeed() {
  let n = 0; const out = [];
  const base = o => ({ id: 's' + String(++n).padStart(3, '0'), difficulty: 1, tags: [], source: 'Dữ liệu mẫu của ứng dụng', status: 'approved', fav: false, deleted: false, history: [], explain: '', created: 0, speak: '', ...o });
  const mc = (subject, grade, topic, text, options, ans, tags, difficulty = 1, explain = '', extra = {}) => {
    options = options.map(String); ans = String(ans);
    const i = options.indexOf(ans); if (i < 0) throw new Error('Seed sai đáp án: ' + text);
    out.push(base({ subject, grade, topic, type: 'mcq', text: nfc(text), options: options.map(nfc), answer: i, tags, difficulty, explain: nfc(explain), ...extra }));
  };
  /* --- TOÁN --- */
  const add = [[5, 3, 8, [6, 7, 8, 9]], [4, 2, 6, [5, 6, 7]], [6, 6, 12, [10, 12, 14]], [8, 5, 13, [12, 13, 14, 15]], [9, 9, 18, [17, 18, 19]], [7, 4, 11, [10, 11, 12]]];
  add.forEach(([a, b, r, o]) => mc('math', a > 7 ? 2 : 1, 'Phép cộng', `${a} + ${b} = ?`, o, r, ['cong'], a > 7 ? 2 : 1, `${a} thêm ${b} là ${r}.`));
  const sub = [[7, 2, 5, [4, 5, 6]], [9, 4, 5, [3, 5, 6]], [10, 7, 3, [2, 3, 4]], [15, 6, 9, [8, 9, 10]], [13, 5, 8, [7, 8, 9]]];
  sub.forEach(([a, b, r, o]) => mc('math', a > 10 ? 2 : 1, 'Phép trừ', `${a} − ${b} = ?`, o, r, ['tru'], a > 10 ? 2 : 1, `${a} bớt ${b} còn ${r}.`));
  [[7, 5, '>'], [3, 8, '<'], [6, 6, '='], [12, 9, '>']].forEach(([a, b, r]) => mc('math', 1, 'So sánh số', `${a} … ${b}  (chọn dấu thích hợp)`, ['>', '<', '='], r, ['sosanh'], 1, `${a} ${r} ${b}.`));
  mc('math', 1, 'Điền số còn thiếu', '5 + __ = 9', [3, 4, 5], 4, ['thieu'], 1, '5 + 4 = 9.');
  mc('math', 2, 'Điền số còn thiếu', '__ − 3 = 4', [6, 7, 8], 7, ['thieu'], 2, '7 − 3 = 4.');
  mc('math', 1, 'Dãy số', '2, 4, 6, __', [7, 8, 9], 8, ['thieu'], 1, 'Mỗi số hơn số trước 2 đơn vị.');
  mc('math', 3, 'Điền số còn thiếu', '3 × __ = 18', [5, 6, 7], 6, ['thieu', 'nhan'], 2, '3 × 6 = 18.');
  [[2, 3], [2, 5], [3, 4], [3, 6], [4, 5], [5, 5], [6, 4], [6, 7], [7, 8], [8, 9], [9, 6], [7, 7], [4, 8], [3, 9], [6, 6], [9, 9], [5, 8], [2, 9], [7, 4], [8, 6]].forEach(([a, b]) => {
    const p = a * b; const c = []; [p + a, p - b, p + b, p - a, p + 1, p - 1].forEach(x => { if (x > 0 && x !== p && !c.includes(x) && c.length < 3) c.push(x); });
    mc('math', 3, 'Bảng cửu chương', `${a} × ${b} = ?`, [p, ...c].sort((x, y) => x - y), p, ['nhan', 'cuuchuong'], p > 40 ? 3 : 2, `${a} × ${b} = ${p}.`);
  });
  [[12, 3], [18, 6], [24, 4], [35, 5], [42, 7], [56, 8], [63, 9], [20, 5]].forEach(([a, b]) => {
    const q = a / b; mc('math', 3, 'Phép chia', `${a} ÷ ${b} = ?`, [q - 1, q, q + 1, q + 2].filter(x => x > 0), q, ['chia'], 2, `${b} × ${q} = ${a} nên ${a} ÷ ${b} = ${q}.`);
  });
  mc('math', 1, 'Toán có lời văn', 'Có 3 quả táo, mẹ cho thêm 2 quả. Có tất cả mấy quả táo?', [4, 5, 6], 5, ['loivan'], 1, '3 + 2 = 5 quả táo.');

/* ---------- Mật khẩu giáo viên (chặn thao tác vô tình của học sinh, không phải bảo mật cao) ---------- */
async function sha(s) { try { if (crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kls|' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) { /* dùng bản đơn giản */ } let h = 5381; for (const c of 'kls|' + s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return 'x' + h; }
function askPin(title) {
  return new Promise(res => { const d = $('#ask'); let done = false; d.innerHTML = `<div class="dlg"><h3>${esc(title)}</h3><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" style="border:2px solid var(--line);border-radius:12px;padding:10px;font-size:1.3rem;text-align:center"><div class="acts"><button class="btn sec" data-r="0">Hủy</button><button class="btn" data-r="1">OK</button></div></div>`;
    const fin = ok => { if (done) return; done = true; const v = $('#pin-in').value; d.close(); res(ok ? v : null); }; d.onclick = e => { const b = e.target.closest('[data-r]'); if (b) fin(b.dataset.r === '1'); }; d.onkeydown = e => { if (e.key === 'Enter') fin(true); }; d.onclose = () => { if (!done) { done = true; res(null); } }; d.showModal(); $('#pin-in').focus(); });
}

function validateQuestion(q) {

    if (!Array.isArray(q.options) || q.options.length < 2 || q.options.length > 6) return 'Trắc nghiệm cần 2–6 phương án';
    if (new Set(q.options.map(exact)).size !== q.options.length) return 'Các phương án bị trùng nhau';
    if (!Number.isInteger(q.answer) || q.answer < 0 || q.answer >= q.options.length) return 'Đáp án đúng không nằm trong các phương án';
  } else if (q.type === 'count') {
    if (!(q.emoji || '').trim()) return 'Chưa nhập hình (emoji) để đếm'; if (!Number.isInteger(q.answer) || q.answer < 1 || q.answer > 10) return 'Số lượng phải từ 1 đến 10';
  } else if (q.type === 'word') {
    const w = Array.from(nfc(q.answer || '')); if (w.length < 2 || w.length > 10 || w.includes(' ')) return 'Từ cần 2–10 chữ cái, không có dấu cách';
  } else if (q.type === 'order') {
    if (!Array.isArray(q.items) || q.items.length < 2 || q.items.length > 8) return 'Sắp xếp cần 2–8 mục';
  } else if (q.type === 'sort') {
    if (!Array.isArray(q.cats) || q.cats.length < 2 || q.cats.length > 3 || q.cats.some(c => !String(c).trim()) || new Set(q.cats.map(exact)).size !== q.cats.length) return 'Phân loại cần 2–3 nhóm khác nhau';
    if (!Array.isArray(q.sitems) || q.sitems.length < 3 || q.sitems.length > 8 || q.sitems.some(x => !Array.isArray(x) || !String(x[0]).trim() || !Number.isInteger(x[1]) || x[1] < 0 || x[1] >= q.cats.length)) return 'Cần 3–8 mục, mỗi mục thuộc một nhóm hợp lệ';

    if (new Set(q.pairs.map(p => exact(p[0]))).size !== q.pairs.length || new Set(q.pairs.map(p => exact(p[1]))).size !== q.pairs.length) return 'Các vế trong cặp bị trùng';
  }

}

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, ''); const first = text.split('\n')[0] || ''; const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];

    const ch = text[i];
    if (inq) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inq = false; } else cur += ch; }
    else if (ch === '"') inq = true; else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if (row.some(x => x.trim() !== '')) rows.push(row); return rows;
}

function qToRow(q) {

  if (q.type === 'mcq') { data = q.options.join('|'); answer = q.answer + 1; } else if (q.type === 'count') { data = q.emoji; answer = q.answer; } else if (q.type === 'word') { data = q.emoji; answer = q.answer; }

const Reports = {
  period: 'day',
  buckets(rs, per) {
    const out = []; const now = new Date(); const day0 = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
    if (per === 'day') for (let i = 13; i >= 0; i--) { const a = day0(now); a.setDate(a.getDate() - i); const b = new Date(a); b.setDate(b.getDate() + 1); out.push({ l: a.getDate() + '/' + (a.getMonth() + 1), from: +a, to: +b }); }
    else if (per === 'week') { const m = day0(now); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); for (let i = 7; i >= 0; i--) { const a = new Date(m); a.setDate(a.getDate() - i * 7); const b = new Date(a); b.setDate(b.getDate() + 7); out.push({ l: a.getDate() + '/' + (a.getMonth() + 1), from: +a, to: +b }); } }
    else for (let i = 5; i >= 0; i--) { const a = new Date(now.getFullYear(), now.getMonth() - i, 1), b = new Date(now.getFullYear(), now.getMonth() - i + 1, 1); out.push({ l: 'T' + (a.getMonth() + 1), from: +a, to: +b }); }
    out.forEach(b => { const r = rs.filter(x => x.ts >= b.from && x.ts < b.to); b.a = r.length; b.c = r.filter(x => x.correct).length; }); return out;
  },
  view() {
    const T = State.mode === 'teacher'; const st = State.activeStudent();

      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px"><div class="stat"><b>${s.answered}</b><span>câu đã làm</span></div><div class="stat"><b>${s.correct}</b><span>câu đúng</span></div><div class="stat"><b>${s.answered - s.correct}</b><span>câu sai</span></div><div class="stat"><b>${s.rate}%</b><span>tỷ lệ đúng</span></div><div class="stat"><b>${Math.round(s.time / 60)}</b><span>phút học</span></div><div class="stat"><b>${s.xp}</b><span>điểm kinh nghiệm</span></div></div>
      <div class="grid c2"><div class="card"><h3 style="margin-bottom:12px">Theo môn học</h3><div class="bars">${Object.entries(SUBJECTS).map(([k, v]) => { const x = s.subj[k]; return `<div class="bar" style="--c:${colors[k]}"><span>${v.icon} ${v.name}</span><div class="track"><div class="fill" style="width:${pct(x.c, x.a)}%"></div></div><span>${x.a ? pct(x.c, x.a) + '% (' + x.a + ')' : '–'}</span></div>`; }).join('')}</div></div>
      <div class="card"><div class="row" style="justify-content:space-between"><h3>Số câu đã làm</h3><select id="rp-per" class="field" style="border:2px solid var(--line);border-radius:12px;padding:4px 8px"><option value="day" ${per === 'day' ? 'selected' : ''}>14 ngày</option><option value="week" ${per === 'week' ? 'selected' : ''}>8 tuần</option><option value="month" ${per === 'month' ? 'selected' : ''}>6 tháng</option></select></div><div class="days">${bk.map(b => `<div title="${b.a} câu, ${b.a ? pct(b.c, b.a) : 0}% đúng"><small>${b.a ? pct(b.c, b.a) + '%' : ''}</small><i style="height:${b.a / mx * 100}%"></i>${b.l}</div>`).join('')}</div><p class="muted" style="font-size:.8rem">Chiều cao: số câu. Chữ phía trên: tỷ lệ đúng.</p></div></div>

/* ===================== ĐỒNG BỘ data.json TỪ GITHUB PAGES =====================
   Mỗi lần mở trang (qua http/https) ứng dụng tải data.json cùng thư mục rồi GỘP vào máy này:
   - Câu hỏi / bài học / tài liệu chưa có trên máy  -> thêm vào.
   - Câu hỏi / bài học đã có -> chỉ cập nhật khi bản trong data.json mới hơn bản trên máy.
   - Mục bạn đã xóa hẳn trên máy này sẽ không tự quay lại (trừ khi bấm "Đồng bộ ngay").
   - KHÔNG đụng tới học sinh, kết quả học tập, lượt chơi, cài đặt của từng máy. */
const Remote = {
  FILE: 'data.json', status: '',
  async fetchData() {
    if (!/^https?:$/.test(location.protocol)) throw new Error('Đang mở trực tiếp từ ổ đĩa (file://) nên không tải được data.json. Hãy mở bằng link https của GitHub Pages.');
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 25000);
    try {
      const res = await fetch(new URL(this.FILE, location.href).href, { cache: 'no-cache', signal: ctl.signal });
      if (res.status === 404) throw new Error('Chưa có file data.json cùng thư mục với file HTML trên GitHub.');
      if (!res.ok) throw new Error('Tải data.json bị lỗi HTTP ' + res.status);
      let j; try { j = await res.json(); } catch (e) { throw new Error('data.json không phải JSON hợp lệ.'); }
      if (!j || j.app !== 'kids_learning_ai_game_studio' || !Array.isArray(j.questions)) throw new Error('data.json không đúng định dạng của ứng dụng (hãy dùng nút “Xuất data.json để đăng GitHub”).');
      return j;
    } catch (e) { throw e.name === 'AbortError' ? new Error('Tải data.json quá lâu (hết thời gian chờ).') : e; }
    finally { clearTimeout(tm); }
  },
  lastMod(x) { const h = Array.isArray(x.history) && x.history.length ? (x.history[x.history.length - 1].ts || 0) : 0; return Math.max(x.updated || 0, h, x.created || 0, x.added || 0); },
  strip(x) { const { _dup, ...r } = x; return JSON.stringify(r); },
  async sync(force = false) {
    const j = await this.fetchData();
    const rec = db.ok ? (await db.getAll('meta')).find(m => m.key === 'remoteSeen') : null;
    const seen = new Set(rec ? rec.ids : []);
    const plan = [
      ['questions', arr => arr.map(normQ).filter(q => !validateQuestion(q)), true],
      ['lessons', arr => arr.filter(l => l && l.id && l.name && Array.isArray(l.qids) && Array.isArray(l.games)), true],
      ['docs', arr => arr.filter(d => d && d.id && Array.isArray(d.pages)), false],
    ];
    const sum = { added: 0, updated: 0 };
    for (const [k, clean, canUpdate] of plan) {
      if (j[k] == null) continue;
      if (!Array.isArray(j[k])) throw new Error(`Mục “${k}” trong data.json không đúng định dạng.`);
      const incoming = clean(j[k]); const idx = new Map(State[k].map((x, i) => [x.id, i])); const toSave = [];
      for (const it of incoming) {
        const key = k + ':' + it.id, i = idx.get(it.id);
        if (i === undefined) { if (force || !seen.has(key)) { State[k].push(it); idx.set(it.id, State[k].length - 1); toSave.push(it); sum.added++; } }
        else if (canUpdate) { const cur = State[k][i]; if ((this.lastMod(it) > this.lastMod(cur) || force) && this.strip(it) !== this.strip(cur)) { State[k][i] = it; toSave.push(it); sum.updated++; } }

    const box = $('#cr-box'), im = $('#cr-img'), sel = $('#cr-sel'); let st = null, rc = null;
    const pos = e => { const r = im.getBoundingClientRect(); return [clamp(e.clientX - r.left, 0, r.width), clamp(e.clientY - r.top, 0, r.height)]; };
    box.onpointerdown = e => { st = pos(e); rc = null; sel.hidden = false; box.setPointerCapture(e.pointerId); e.preventDefault(); };
    box.onpointermove = e => { if (!st) return; const p = pos(e); rc = [Math.min(st[0], p[0]), Math.min(st[1], p[1]), Math.abs(p[0] - st[0]), Math.abs(p[1] - st[1])]; Object.assign(sel.style, { left: rc[0] + 'px', top: rc[1] + 'px', width: rc[2] + 'px', height: rc[3] + 'px' }); };

   Module (Giai đoạn 3): hình SVG · engine mới · trò vận động Pose · ôn tập · nhiệm vụ · phần thưởng
   ===================================================================== */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const distinct = (k, a, b, ex = []) => { const out = []; while (out.length < k) { const v = ri(a, b); if (!ex.includes(v) && !out.includes(v)) out.push(v); } return out; };

/* ---------------- Hình minh họa (SVG tạo trực tiếp, không cần internet) ---------------- */
const Shapes = {
  F: '#F2693F', B: '#FFFFFF', S: '#22264A',
  isTok: t => /^(svg|sil|color):/.test(String(t)),
  wrap: (inner, vb = '0 0 100 100') => `<svg class="shp" viewBox="${vb}" aria-hidden="true">${inner}</svg>`,
  shape(n) {
    const st = `stroke="${this.S}" stroke-width="3" stroke-linejoin="round"`, f = '#7FA2FF', d = '#4F73D9', l = '#B8CBFF';
    const M = {
      circle: `<circle cx="50" cy="50" r="40" fill="${f}" ${st}/>`, square: `<rect x="14" y="14" width="72" height="72" fill="${f}" ${st}/>`, rectangle: `<rect x="6" y="26" width="88" height="48" fill="${f}" ${st}/>`,
      triangle: `<polygon points="50,10 92,88 8,88" fill="${f}" ${st}/>`, star: `<polygon points="50,8 61,38 93,38 67,57 77,90 50,70 23,90 33,57 7,38 39,38" fill="${f}" ${st}/>`,
      pentagon: `<polygon points="50,8 92,38 76,88 24,88 8,38" fill="${f}" ${st}/>`, hexagon: `<polygon points="27,12 73,12 96,50 73,88 27,88 4,50" fill="${f}" ${st}/>`,
      cube: `<polygon points="50,8 90,28 50,48 10,28" fill="${l}" ${st}/><polygon points="10,28 50,48 50,92 10,72" fill="${f}" ${st}/><polygon points="50,48 90,28 90,72 50,92" fill="${d}" ${st}/>`,
      cuboid: `<polygon points="8,40 30,18 94,18 72,40" fill="${l}" ${st}/><rect x="8" y="40" width="64" height="48" fill="${f}" ${st}/><polygon points="72,40 94,18 94,66 72,88" fill="${d}" ${st}/>`
    };
    return this.wrap(M[n] || '');
  },
  frac(a, b, kind) {
    const st = `stroke="${this.S}" stroke-width="2.5"`; let r = '';
    if (kind === 'bar') { const w = 90 / b; for (let i = 0; i < b; i++) r += `<rect x="${(5 + i * w).toFixed(2)}" y="30" width="${w.toFixed(2)}" height="40" fill="${i < a ? this.F : this.B}" ${st}/>`; return this.wrap(r); }
    if (b === 1) return this.wrap(`<circle cx="50" cy="50" r="42" fill="${a >= 1 ? this.F : this.B}" ${st}/>`);
    for (let i = 0; i < b; i++) { const a0 = -Math.PI / 2 + i * 2 * Math.PI / b, a1 = -Math.PI / 2 + (i + 1) * 2 * Math.PI / b; const p = x => x.toFixed(2); r += `<path d="M50 50 L${p(50 + 42 * Math.cos(a0))} ${p(50 + 42 * Math.sin(a0))} A42 42 0 ${2 * Math.PI / b > Math.PI ? 1 : 0} 1 ${p(50 + 42 * Math.cos(a1))} ${p(50 + 42 * Math.sin(a1))} Z" fill="${i < a ? this.F : this.B}" ${st}/>`; }
    return this.wrap(r);
  },
  opt(t) {
    t = String(t); let m;
    if ((m = t.match(/^svg:shape:(\w+)$/))) return this.shape(m[1]);
    if ((m = t.match(/^svg:frac:(\d+)\/(\d+):(circle|bar)$/))) return this.frac(+m[1], +m[2], m[3]);
    if ((m = t.match(/^sil:(.+)$/))) return `<span class="sil">${esc(m[1])}</span>`;
    if ((m = t.match(/^color:(#[0-9a-fA-F]{6})$/))) return `<span class="swatch" style="background:${m[1]}"></span>`;
    return esc(t);
  },
  art(t) {
    if (!t) return ''; if (t.startsWith('emoji:')) return `<div class="artemoji">${esc(t.slice(6))}</div>`;
    if (t.startsWith('grid:')) { const i = t.indexOf('|'); const cols = +t.slice(5, i); return `<div class="artgrid" style="grid-template-columns:repeat(${cols},auto)">${t.slice(i + 1).split(',').map(x => x === '?' ? '<span class="qm">?</span>' : `<span>${esc(x)}</span>`).join('')}</div>`; }
    if (t.startsWith('svg:')) return `<div class="artsvg">${this.opt(t)}</div>`; return '';
  }
};

class MCQ2 {
  constructor(s) { this.s = s; this.q = s.item; this.digits = true; this.v = s.game.variant || ''; this.busy = false; }

  mount() {

    s.setPrompt((q.image ? `<img class="qimg" src="${q.image}" alt="">` : '') + Shapes.art(q.art) + esc(q.text) + (q.speak && !voice ? `<span class="hint">${esc(q.speak)}</span>` : ''), q.speak ? { text: q.speak, lang: 'en-US' } : null);
    if (voice) s.later(() => Speech.speak(q.speak, 'en-US'), 300); play.classList.toggle('float', !!s.game.float);

    play.innerHTML = pre + `<div class="opts n${Math.min(opts.length, 4)}${v === 'zone' ? ' zone' : ''}${v === 'vlane' ? ' vlane' : ''}${v === 'basket' ? ' baskets' : ''}">${opts.map((o, k) => `<button class="target opt${isBig(o.t) || Shapes.isTok(o.t) ? ' big' : ''}" data-i="${o.i}" style="--k:${k}"><span class="kb">${k + 1}</span><span class="lbl">${v === 'basket' ? '<span class="bk">🧺</span>' : ''}${Shapes.opt(o.t)}</span>${Dwell.ring()}</button>`).join('')}</div>`;

  dueQs() {
    if (!State.student) return []; const now = Date.now(), day = 864e5, by = new Map();

    const out = []; by.forEach((x, id) => { const q = State.q(id); if (!q || q.deleted || q.status !== 'approved' || !['mcq', 'count', 'pairs', 'order', 'word', 'sort'].includes(q.type)) return; const iv = this.ivDays[Math.min(x.streak, this.ivDays.length - 1)] * day; if (now - x.last >= iv) out.push({ q, over: now - x.last - iv }); });
    return out.sort((a, b) => b.over - a.over).map(o => o.q);
  }
};

const inRect = (p, r, pad = 10) => p.x >= r.left - pad && p.x <= r.right + pad && p.y >= r.top - pad && p.y <= r.bottom + pad;

/* ---------- Đánh trống / Đấm: chọn đáp án bằng động tác nhanh ---------- */
class DrumEngine {
  constructor(s) { this.s = s; this.q = s.item; this.maxTries = 2; this.noPointerDwell = true; this.prev = new Map(); this.cool = 0; this.punch = s.game.variant === 'punch'; this.digits = true; }
  mount() {
    const { s, q } = this; const opts = shuffle(q.options.map((t, i) => ({ t, i }))); s.play.classList.remove('float');
    s.setPrompt(Shapes.art(q.art) + esc(q.text) + `<small>${s.camOn ? (this.punch ? 'Đấm nhanh vào đáp án đúng' : 'Đánh xuống nhanh vào trống có đáp án đúng') : 'Bấm chuột hoặc chạm vào đáp án đúng'}</small>`);
    s.play.innerHTML = `<div class="drums">${opts.map((o, k) => `<button class="target drum" data-i="${o.i}"><span class="dk">${this.punch ? '🥊' : '🥁'}</span><span class="lbl">${Shapes.opt(o.t)}</span><span class="kb">${k + 1}</span></button>`).join('')}</div>`;
    s.play.onclick = e => { const b = e.target.closest('.drum'); if (!b || b.disabled || s.locked) return; b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 220); if (+b.dataset.i === q.answer) { b.classList.add('ok'); s.right(); } else { b.classList.add('bad'); b.disabled = true; s.wrong(); } };
  }
  points() { const s = this.s; if (!s.camOn || !cam.active) return []; if (cam.mode === 'pose') return (cam.pose.pts || []).map((p, i) => ({ id: 'w' + i, x: p.x, y: p.y })); if (cam.cursor.visible) return [{ id: 'c', x: cam.cursor.x, y: cam.cursor.y }]; return []; }
  tick(dt) {
    const s = this.s; if (s.locked) return; const thr = 1900 - Settings.v.sens * 130; this.cool -= dt;
    this.points().forEach(p => { const o = this.prev.get(p.id); this.prev.set(p.id, p); if (!o || this.cool > 0 || dt <= 0) return; const dx = p.x - o.x, dy = p.y - o.y, sp = Math.hypot(dx, dy) / dt * 1000; if (sp < thr || (!this.punch && dy / dt * 1000 < thr * .55)) return;
      for (const b of $$('.drum:not([disabled])', s.play)) if (inRect(p, b.getBoundingClientRect())) { this.cool = 450; b.click(); break; } });
  }
  reveal() { const b = this.s.play.querySelector(`[data-i="${this.q.answer}"]`); if (b) { b.disabled = false; b.classList.remove('bad'); b.classList.add('reveal'); } }
  destroy() { this.s.play.onclick = null; }
}

    this.cards = $$('.dcard', s.play); s.play.onclick = e => { const b = e.target.closest('.dcard'); if (b && !s.locked) { this.lane = +b.dataset.k; this.paint(); } }; this.paint(0);

  tick(dt) {
    const s = this.s; if (s.locked || this.done) return; this.t += dt; const f = Math.min(1, this.t / this.T), n = this.opts.length, dg = $('#dg'); if (!dg) return;
    const p = s.pointer(); if (p.active) { const r = dg.getBoundingClientRect(); this.lane = clamp(Math.floor((p.x - r.left) / r.width * n), 0, n - 1); } this.paint(f);
    if (f >= 1) { this.done = true; if (this.opts[this.lane].i === this.q.answer) { this.cards[this.lane].classList.add('ok'); s.right(); } else { this.cards[this.lane].classList.add('bad'); s.wrong(); } }

  reveal() { const b = this.s.play.querySelector(`.dcard[data-i="${this.q.answer}"]`); if (b) b.classList.add('reveal'); }
  destroy() { this.s.play.onclick = null; }
}

/* ---------- Xóa sương mờ: lau để lộ câu hỏi (ngón tay/đầu/chuột) ---------- */
class FogEngine {
  constructor(s) { this.s = s; this.inner = new MCQ2(s); this.acc = 0; this.clear = false; this.last = null; }
  mount() {
    const s = this.s; this.inner.mount(); s.play.classList.add('locked'); const st = s.stage, qb = $('.qbar', st), top = qb.offsetTop, h = s.play.offsetTop + s.play.offsetHeight - top;
    const cv = this.cv = document.createElement('canvas'); cv.className = 'fog'; cv.width = st.clientWidth; cv.height = Math.max(120, h); Object.assign(cv.style, { top: top + 'px', left: '0', width: st.clientWidth + 'px', height: cv.height + 'px' }); st.append(cv);
    const x = this.ctx = cv.getContext('2d', { willReadFrequently: true }); const g = x.createLinearGradient(0, 0, cv.width, cv.height); g.addColorStop(0, '#C9D3EA'); g.addColorStop(.5, '#E4EAF7'); g.addColorStop(1, '#BFCBE6'); x.fillStyle = g; x.fillRect(0, 0, cv.width, cv.height);
    x.fillStyle = 'rgba(34,38,74,.55)'; x.font = '800 26px Baloo 2, sans-serif'; x.textAlign = 'center'; x.fillText('☁️ Lau sương mờ để xem câu hỏi', cv.width / 2, cv.height / 2);
    const sk = this.sk = document.createElement('button'); sk.className = 'btn sec sm fogskip'; sk.textContent = 'Bỏ qua sương mờ'; sk.onclick = () => this.finish(); st.append(sk);
  }
  finish() { if (this.clear) return; this.clear = true; if (this.cv) this.cv.remove(); if (this.sk) this.sk.remove(); this.s.play.classList.remove('locked'); }
  tick(dt) {
    if (this.clear) return; const s = this.s, p = s.pointer(); const rc = this.cv.getBoundingClientRect();
    if (p.active) { const x = (p.x - rc.left) * this.cv.width / rc.width, y = (p.y - rc.top) * this.cv.height / rc.height; const c = this.ctx; c.globalCompositeOperation = 'destination-out'; c.lineCap = 'round'; c.lineWidth = 120; c.beginPath(); if (this.last) { c.moveTo(this.last.x, this.last.y); c.lineTo(x, y); c.stroke(); } c.beginPath(); c.arc(x, y, 60, 0, 7); c.fill(); c.globalCompositeOperation = 'source-over'; this.last = { x, y }; } else this.last = null;
    this.acc += dt; if (this.acc > 300) { this.acc = 0; const t = document.createElement('canvas'); t.width = 24; t.height = 14; const tc = t.getContext('2d', { willReadFrequently: true }); tc.drawImage(this.cv, 0, 0, 24, 14); const d = tc.getImageData(0, 0, 24, 14).data; let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 70) n++; if (n / 336 >= .6) this.finish(); }
  }
  reveal() { this.finish(); this.inner.reveal(); }
  destroy() { if (this.cv) this.cv.remove(); if (this.sk) this.sk.remove(); this.inner.destroy(); }
  get digits() { return this.clear; }
}
